<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync AI | Professional ATS Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .gradient-text { background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .custom-loader { border: 3px solid #f3f3f3; border-top: 3px solid #0d9488; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="p-6 bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold gradient-text flex items-center gap-2">
                🧠 SkillSync AI
            </h1>
            <span class="text-sm text-slate-500 font-medium tracking-wide">PROFESSIONAL ATS ANALYZER</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 px-6">
        
        <div id="input-section" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-card p-8 rounded-2xl shadow-sm">
                <h3 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    📄 1. Upload Resume
                </h3>
                <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center hover:border-teal-500 transition-colors cursor-pointer bg-slate-50">
                    <input type="file" id="resumeFile" class="hidden" accept=".pdf">
                    <div class="flex flex-col items-center">
                        <svg class="w-12 h-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p id="file-name" class="text-slate-600 font-medium">Click to upload PDF</p>
                        <p class="text-xs text-slate-400 mt-1">Maximum file size: 5MB</p>
                    </div>
                </div>
            </div>

            <div class="glass-card p-8 rounded-2xl shadow-sm">
                <h3 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    📝 2. Job Description
                </h3>
                <textarea id="jobDescription" placeholder="Paste the job requirements from LinkedIn, Internshala, etc..." 
                    class="w-full h-40 p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition-all text-slate-600 resize-none bg-slate-50"></textarea>
            </div>
        </div>

        <div class="flex justify-center mt-12">
            <button id="analyzeBtn" class="bg-teal-600 hover:bg-teal-700 text-white px-12 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-teal-200/50 transition-all flex items-center gap-3 active:scale-95">
                Analyze Resume
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center mt-10">
            <div class="custom-loader mb-3"></div>
            <p class="text-slate-500 animate-pulse">Running ATS Simulation...</p>
        </div>

        <hr class="my-16 border-slate-200">

        <div id="results-section" class="opacity-0 transition-opacity duration-700">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                
                <div class="lg:col-span-1 glass-card p-8 rounded-2xl shadow-sm flex flex-col items-center justify-center">
                    <h4 class="text-slate-500 font-bold text-xs uppercase tracking-widest mb-4">Weighted ATS Score</h4>
                    <div class="relative w-48 h-48">
                        <canvas id="scoreChart"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center flex-col">
                            <span id="finalScoreText" class="text-4xl font-bold text-slate-800">0%</span>
                            <span class="text-[10px] text-slate-400 font-semibold uppercase">Compatibility</span>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 glass-card p-8 rounded-2xl shadow-sm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h4 class="text-green-600 font-bold text-xs uppercase tracking-widest mb-4">Matched Skills ✔</h4>
                            <div id="matchedSkills" class="flex flex-wrap gap-2">
                                </div>
                        </div>
                        <div>
                            <h4 class="text-rose-500 font-bold text-xs uppercase tracking-widest mb-4">Missing Skills ❌</h4>
                            <div id="missingSkills" class="flex flex-wrap gap-2">
                                </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <p class="text-slate-500 text-sm">Semantic Match (TF-IDF)</p>
                    <p id="atsScore" class="text-2xl font-bold text-slate-800">0%</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200">
                    <p class="text-slate-500 text-sm">Keyword Density Match</p>
                    <p id="skillMatchScore" class="text-2xl font-bold text-slate-800">0%</p>
                </div>
            </div>
        </div>

    </main>

    <script>
    // --- UI Interactions ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('resumeFile');
    const fileNameDisp = document.getElementById('file-name');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];

            // Optional: size check (5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert("File too large (max 5MB)");
                return;
            }

            fileNameDisp.innerText = file.name;
        }
    };

    // --- Chart Logic ---
    let scoreChart;
    function updateChart(score) {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        
        scoreChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [score, 100 - score],
                    backgroundColor: ['#0d9488', '#f1f5f9'],
                    borderWidth: 0,
                    circumference: 270,
                    rotation: 225,
                    cutout: '85%',
                    borderRadius: 10
                }]
            },
            options: {
                plugins: { tooltip: { enabled: false } },
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    // --- API Logic ---
    document.getElementById('analyzeBtn').onclick = async () => {
        const resume = fileInput.files[0];
        const jd = document.getElementById('jobDescription').value;

        if (!resume || !jd) {
            alert("Please provide both a resume and a job description.");
            return;
        }

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('results-section').classList.add('opacity-0');

        const formData = new FormData();
        formData.append('resume', resume);
        formData.append('job_description', jd);

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error("Server not responding properly");
            }

            const data = await response.json();
            console.log("API Response:", data); // DEBUG

            // Populate Results
            document.getElementById('atsScore').innerText = `${data.ats_score}%`;
            document.getElementById('skillMatchScore').innerText = `${data.skill_match_score}%`;
            document.getElementById('finalScoreText').innerText = `${data.final_score}%`;

            // Skill Tags
            const renderTags = (containerId, list, colorClass) => {
                const container = document.getElementById(containerId);

                if (!list || list.length === 0) {
                    container.innerHTML = '<span class="text-slate-400 text-sm italic">None identified</span>';
                    return;
                }

                container.innerHTML = '';
                list.forEach(skill => {
                    container.innerHTML += `<span class="px-3 py-1 rounded-full text-sm font-medium border ${colorClass}">${skill}</span>`;
                });
            };

            renderTags('matchedSkills', data.matched_skills, 'bg-green-50 text-green-700 border-green-100');

            // ✅ FIXED HERE (main bug)
            renderTags('missingSkills', data.missing_skills, 'bg-rose-50 text-rose-700 border-rose-100');

            // Chart + UI
            updateChart(data.final_score);
            document.getElementById('results-section').classList.remove('opacity-0');

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        } catch (error) {
            console.error("Error:", error);
            alert("Error: Check backend (FastAPI running?) or console logs (F12)");
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    };

    updateChart(0);
</script>

</body>
</html>
